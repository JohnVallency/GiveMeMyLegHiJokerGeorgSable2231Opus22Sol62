<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galaxy S27 · Предпросмотр нард</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#25272a;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 16px}.preview{display:flex;flex-direction:column;align-items:center;gap:18px}header{text-align:center}h1{font-size:18px;font-weight:500;margin:0 0 7px}p{font-size:12px;color:#898d94;margin:0}.phone{width:374px;height:790px;background:#17191c;border-radius:47px;padding:8px;position:relative;box-shadow:0 0 0 1px #72777d,0 0 0 3px #d0d3d5,0 22px 55px #0002}.screen{height:100%;overflow:hidden;border-radius:39px;background:#101b1a;position:relative;display:flex;flex-direction:column}.status{height:28px;flex-shrink:0;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:10px;background:#123333}.camera{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#07090a;box-shadow:inset 0 0 0 3px #111518;z-index:4}iframe{width:100%;flex:1;border:0;min-height:0;background:#123333}.nav{height:20px;flex-shrink:0;background:#132b29;display:grid;place-items:center}.nav:after{content:'';width:105px;height:4px;background:#ddd;border-radius:6px}.power,.volume{position:absolute;right:-5px;width:3px;background:#55595d;border-radius:2px}.power{top:242px;height:40px}.volume{top:130px;height:76px}button{background:#fff;border:1px solid #ddd;border-radius:20px;padding:8px 16px;color:#555;cursor:pointer;font-size:12px}.phone.landscape{width:790px;height:374px}.landscape .status,.landscape .nav{display:none}.landscape .camera{left:15px;top:50%;transform:translateY(-50%)}.landscape .power,.landscape .volume{display:none}.phone.landscape .screen{padding-left:24px;padding-right:12px}@media(max-width:820px){.phone.landscape{width:min(790px,94vw);height:min(374px,44vw)}}@media(max-height:930px) and (min-width:500px){.preview{zoom:.82}}@media(max-width:410px){.phone:not(.landscape){width:92vw;height:calc(92vw * 2.11)}}
@media(max-width:499px){body{padding:16px 10px}.phone:not(.landscape){height:min(790px,calc(100dvh - 150px));width:auto;aspect-ratio:374/790}.preview{gap:14px}h1{font-size:16px}p{font-size:10px}}</style></head>
<body><main class="preview"><header><h1>Samsung Galaxy S27</h1><p>Условный макет устройства · интерактивный предпросмотр</p></header><div class="phone" id="phone"><span class="volume"></span><span class="power"></span><div class="screen"><div class="status"><span>12:45</span><span>▴▴▴ &nbsp; Wi-Fi &nbsp; ▰ 100%</span></div><div class="camera"></div><iframe src="/" title="Нарды на телефоне" allow="fullscreen"></iframe><div class="nav"></div></div></div><button id="rotate" onclick="document.getElementById('phone').classList.toggle('landscape')">↻ Повернуть телефон</button></main></body></html>
